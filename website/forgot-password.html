<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | KisanMitra</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- FontAwesome -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
            colors: {
              primary: {
                DEFAULT: '#2D5016',
                dark: '#1A3009',
                50: '#f0fdf4',
                100: '#dcfce7',
                200: '#bbf7d0',
                600: '#16a34a',
                700: '#2D5016',
                800: '#1A3009',
                900: '#0f1f06',
              },
              accent: {
                DEFAULT: '#C17F24',
                50: '#fff8eb',
                100: '#ffefc6',
              },
              neutral: {
                50: '#F9F7F2',
                100: '#F0EDE6',
                200: '#E2DDD5',
                300: '#D0C8BD',
                400: '#B5AA9C',
                500: '#9A8D7E',
                600: '#7A7268',
                700: '#5A5349',
                800: '#3A352F',
                900: '#1A1A18',
              }
            }
          }
        }
      }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="js/app.js"></script>
</head>
<body class="min-h-screen bg-neutral-50 flex items-center justify-center p-4 font-sans antialiased text-neutral-900">
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-neutral-200 p-8 sm:p-10">
        <!-- Logo -->
        <div class="flex flex-col items-center mb-8">
            <a href="index.html" class="flex items-center space-x-2.5 mb-4 group">
                <div class="w-12 h-12 rounded-2xl bg-primary flex items-center justify-center text-white font-black text-2xl shadow-lg shadow-primary/20 group-hover:scale-105 transition-transform">K</div>
                <span class="text-2xl font-bold tracking-tight text-primary">KisanMitra</span>
            </a>
            <h1 class="text-2xl font-extrabold text-neutral-900 tracking-tight">Forgot Password</h1>
            <p class="text-sm text-neutral-500 mt-1 text-center">Enter your registered email and we'll send you a password reset link.</p>
        </div>

        <!-- Alert messages -->
        <div id="alertMessage" class="hidden p-4 rounded-xl text-sm mb-6 flex items-start gap-2.5">
            <i id="alertIcon" data-lucide="info" class="w-5 h-5 shrink-0 mt-0.5"></i>
            <span id="alertText"></span>
        </div>

        <!-- Form -->
        <form id="forgotForm" class="space-y-5" onsubmit="handleForgot(event)">
            <div>
                <label for="email" class="block text-sm font-semibold text-neutral-700 mb-2">Email Address</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-neutral-400"></i>
                    <input type="email" id="email" required placeholder="farmer@example.com" class="w-full pl-11 pr-4 py-3 bg-neutral-50 border border-neutral-300 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm font-medium transition-all">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 px-6 rounded-xl bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow-md shadow-primary/20 transition-all hover:-translate-y-0.5 active:scale-95 flex items-center justify-center gap-2">
                <span>Send Reset Link</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-neutral-100 text-center">
            <a href="login.html" class="inline-flex items-center gap-2 text-sm font-bold text-primary hover:underline">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to Login
            </a>
        </div>
    </div>

    <script>
        function showAlert(msg, isSuccess = false) {
            const alert = document.getElementById('alertMessage');
            const alertText = document.getElementById('alertText');
            const alertIcon = document.getElementById('alertIcon');
            
            alert.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-green-50', 'text-green-700', 'border-green-200');
            
            if (isSuccess) {
                alert.classList.add('bg-green-50', 'text-green-700', 'border', 'border-green-200');
                alertIcon.setAttribute('data-lucide', 'check-circle-2');
            } else {
                alert.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
                alertIcon.setAttribute('data-lucide', 'alert-circle');
            }
            
            alertText.textContent = msg;
            if(window.lucide) lucide.createIcons();
        }

        async function handleForgot(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const email = document.getElementById('email').value.trim();
            
            btn.disabled = true;
            btn.innerHTML = '<span class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin mr-2"></span> Sending...';

            try {
                if (window.FM && window.FM.auth) {
                    await window.FM.auth.sendPasswordResetEmail(email);
                    showAlert('Password reset link sent! Check your inbox.', true);
                } else {
                    showAlert('Demo Mode: Reset link sent to ' + email, true);
                }
            } catch (err) {
                showAlert(err.message || 'Failed to send reset email. Please verify your address.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span>Send Reset Link</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>';
                if(window.lucide) lucide.createIcons();
            }
        }

        window.addEventListener('load', () => { if(window.lucide) lucide.createIcons(); });
    </script>
</body>
</html>
