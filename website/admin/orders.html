<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform Orders | KisanMitra Admin</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              DEFAULT: '#2D5016',
              50:  '#F2F7EC',
              100: '#E0EDD0',
              200: '#BEDBA2',
              300: '#90C168',
              400: '#68A83B',
              500: '#4A7C23',
              600: '#2D5016',
              700: '#1A3009',
              800: '#0E1C05',
              900: '#060D02',
            },
            accent: {
              DEFAULT: '#C17F24',
              50:  '#FDF8EE',
              100: '#F9EDD1',
              200: '#F3D89E',
              300: '#EAC060',
              400: '#DEA737',
              500: '#C17F24',
              600: '#9A6119',
              700: '#744912',
              800: '#4E300B',
              900: '#281805',
            },
            neutral: {
              50:  '#F9F7F2',
              100: '#F0EDE6',
              200: '#E2DDD5',
              300: '#C8C2B8',
              400: '#A09890',
              500: '#7A7268',
              600: '#5A5450',
              700: '#403C38',
              800: '#2A2724',
              900: '#1A1A18',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/cloudinary.js"></script>
  <script src="../js/produce-images.js"></script>
  <script src="../js/panel.js"></script>
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased min-h-screen flex flex-col">
  <main id="main-content" class="flex-1 lg:ml-72 transition-all duration-300 min-h-screen flex flex-col">
    <div class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">

      <div class="space-y-6">
        <div>
          <h1 class="text-3xl font-extrabold text-neutral-900 tracking-tight">Platform Orders</h1>
          <p class="text-sm text-neutral-500 mt-1">Live order monitor across all platform transactions.</p>
        </div>

        <div class="bg-white rounded-3xl border border-neutral-100 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
                <tr class="border-b border-neutral-100 text-xs font-semibold text-neutral-400 uppercase tracking-wider bg-neutral-50/50">
                  <th class="py-4 px-6">Order ID</th>
                  <th class="py-4 px-4">Date</th>
                  <th class="py-4 px-4">Buyer</th>
                  <th class="py-4 px-4">Farmer</th>
                  <th class="py-4 px-4">Total</th>
                  <th class="py-4 px-4">Status</th>
                  <th class="py-4 px-6 text-right">Status Override</th>
                </tr>
              </thead>
              <tbody id="admin-orders-tbody" class="divide-y divide-neutral-100 text-sm">
                <tr><td colspan="7" class="py-12 text-center text-neutral-400">Loading orders...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <script>
        document.addEventListener('DOMContentLoaded', () => {
          window.initPanel({ role: 'admin', currentPage: 'orders', title: 'Order Operations' });
          loadOrders();
        });

        async function loadOrders() {
          try {
            const snap = await window.FM.db.collection('orders').get();
            const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));

            const tbody = document.getElementById('admin-orders-tbody');
            if (orders.length === 0) {
              tbody.innerHTML = '<tr><td colspan="7" class="py-12 text-center text-neutral-400">No orders found.</td></tr>';
              return;
            }

            orders.sort((a,b) => {
              const ta = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(a.createdAt);
              const tb = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(b.createdAt);
              return tb - ta;
            });

            tbody.innerHTML = orders.map(o => {
              const dt = o.createdAt?.toDate ? o.createdAt.toDate() : new Date(o.createdAt);
              return `
                <tr class="hover:bg-neutral-50/50">
                  <td class="py-4 px-6 font-mono font-bold text-xs">#${o.id.slice(0,8)}</td>
                  <td class="py-4 px-4 text-xs text-neutral-500">${dt.toLocaleDateString('en-IN')}</td>
                  <td class="py-4 px-4 font-bold text-neutral-800 text-xs">${o.buyerName || 'Buyer'}</td>
                  <td class="py-4 px-4 text-xs font-semibold text-neutral-700">${o.farmerName || 'Farmer'}</td>
                  <td class="py-4 px-4 font-black text-primary">${window.formatCurrency(o.total)}</td>
                  <td class="py-4 px-4">${window.getOrderStatusBadge(o.status || 'pending')}</td>
                  <td class="py-4 px-6 text-right">
                    <select onchange="overrideStatus('${o.id}', this.value)" class="text-xs font-bold px-3 py-1.5 bg-neutral-100 rounded-xl border border-neutral-200">
                      <option value="pending" ${o.status === 'pending' ? 'selected' : ''}>Pending</option>
                      <option value="accepted" ${o.status === 'accepted' ? 'selected' : ''}>Accepted</option>
                      <option value="processing" ${o.status === 'processing' ? 'selected' : ''}>Processing</option>
                      <option value="out_for_delivery" ${o.status === 'out_for_delivery' ? 'selected' : ''}>Dispatched</option>
                      <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                      <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                    </select>
                  </td>
                </tr>
              `;
            }).join('');
          } catch(err) {
            console.error(err);
          }
        }

        async function overrideStatus(id, status) {
          try {
            await window.FM.db.collection('orders').doc(id).update({ status });
            window.toast({ type: 'success', message: 'Status updated to ' + status });
          } catch(err) {
            window.toast({ type: 'error', message: 'Failed to update.' });
          }
        }
      </script>

    </div>
  </main>
</body>
</html>
