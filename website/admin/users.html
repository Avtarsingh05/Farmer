<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users | KisanMitra Admin</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              DEFAULT: '#2D5016',
              50:  '#F2F7EC',
              100: '#E0EDD0',
              200: '#BEDBA2',
              300: '#90C168',
              400: '#68A83B',
              500: '#4A7C23',
              600: '#2D5016',
              700: '#1A3009',
              800: '#0E1C05',
              900: '#060D02',
            },
            accent: {
              DEFAULT: '#C17F24',
              50:  '#FDF8EE',
              100: '#F9EDD1',
              200: '#F3D89E',
              300: '#EAC060',
              400: '#DEA737',
              500: '#C17F24',
              600: '#9A6119',
              700: '#744912',
              800: '#4E300B',
              900: '#281805',
            },
            neutral: {
              50:  '#F9F7F2',
              100: '#F0EDE6',
              200: '#E2DDD5',
              300: '#C8C2B8',
              400: '#A09890',
              500: '#7A7268',
              600: '#5A5450',
              700: '#403C38',
              800: '#2A2724',
              900: '#1A1A18',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/cloudinary.js"></script>
  <script src="../js/produce-images.js"></script>
  <script src="../js/panel.js"></script>
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased min-h-screen flex flex-col">
  <main id="main-content" class="flex-1 lg:ml-72 transition-all duration-300 min-h-screen flex flex-col">
    <div class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">

      <div class="space-y-6">
        <div>
          <h1 class="text-3xl font-extrabold text-neutral-900 tracking-tight">Platform Users</h1>
          <p class="text-sm text-neutral-500 mt-1">Directory of all registered farmers, buyers, and administrators.</p>
        </div>

        <div class="bg-white rounded-3xl p-4 border border-neutral-100 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
          <div class="flex items-center gap-2 overflow-x-auto w-full sm:w-auto">
            <button onclick="filterUsers('all')" class="u-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-primary text-white" data-role="all">All Roles</button>
            <button onclick="filterUsers('farmer')" class="u-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all text-neutral-600 hover:bg-neutral-100" data-role="farmer">Farmers</button>
            <button onclick="filterUsers('buyer')" class="u-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all text-neutral-600 hover:bg-neutral-100" data-role="buyer">Buyers</button>
            <button onclick="filterUsers('admin')" class="u-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all text-neutral-600 hover:bg-neutral-100" data-role="admin">Admins</button>
          </div>
          <input type="text" id="user-search" placeholder="Search name or email..." class="w-full sm:w-64 px-4 py-2 text-xs bg-neutral-50 border border-neutral-200 rounded-full focus:outline-none focus:border-primary">
        </div>

        <div class="bg-white rounded-3xl border border-neutral-100 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
                <tr class="border-b border-neutral-100 text-xs font-semibold text-neutral-400 uppercase tracking-wider bg-neutral-50/50">
                  <th class="py-4 px-6">User</th>
                  <th class="py-4 px-4">Contact</th>
                  <th class="py-4 px-4">Role</th>
                  <th class="py-4 px-4">Location</th>
                  <th class="py-4 px-6 text-right">Role Changer</th>
                </tr>
              </thead>
              <tbody id="users-tbody" class="divide-y divide-neutral-100 text-sm">
                <tr><td colspan="5" class="py-12 text-center text-neutral-400">Loading registered users...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <script>
        let allUsers = [];
        let curRoleFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
          window.initPanel({ role: 'admin', currentPage: 'users', title: 'User Management' });
          loadUsers();
          document.getElementById('user-search').addEventListener('input', renderUsers);
        });

        async function loadUsers() {
          try {
            const snap = await window.FM.db.collection('users').get();
            allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            renderUsers();
          } catch(err) {
            console.error(err);
          }
        }

        function filterUsers(r) {
          curRoleFilter = r;
          document.querySelectorAll('.u-tab').forEach(b => {
            if (b.dataset.role === r) {
              b.className = 'u-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-primary text-white';
            } else {
              b.className = 'u-tab px-4 py-1.5 rounded-full text-xs font-bold transition-all text-neutral-600 hover:bg-neutral-100';
            }
          });
          renderUsers();
        }

        function renderUsers() {
          const query = (document.getElementById('user-search').value || '').toLowerCase();
          const filtered = allUsers.filter(u => {
            const matchesRole = curRoleFilter === 'all' || (u.role || 'farmer') === curRoleFilter;
            const matchesSearch = (u.name || '').toLowerCase().includes(query) || (u.email || '').toLowerCase().includes(query);
            return matchesRole && matchesSearch;
          });

          const tbody = document.getElementById('users-tbody');
          if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="py-12 text-center text-neutral-400">No users found.</td></tr>';
            return;
          }

          tbody.innerHTML = filtered.map(u => {
            const isRoot = u.id === window.ADMIN_UID;
            const roleBadge = u.role === 'admin'
              ? '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-purple-100 text-purple-800">Admin</span>'
              : (u.role === 'buyer'
                ? '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-blue-100 text-blue-800">Buyer</span>'
                : '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-800">Farmer</span>');

            return `
              <tr class="hover:bg-neutral-50/50 transition-colors">
                <td class="py-4 px-6">
                  <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-neutral-100 text-neutral-800 font-bold flex items-center justify-center text-sm shrink-0">
                      ${(u.name || 'U').charAt(0)}
                    </div>
                    <div>
                      <p class="font-bold text-neutral-900">${u.name || 'Anonymous'} ${isRoot ? '<span class="text-[10px] text-amber-600 font-black ml-1">(Root)</span>' : ''}</p>
                      <p class="text-xs text-neutral-400">${u.email || 'No email'}</p>
                    </div>
                  </div>
                </td>
                <td class="py-4 px-4 font-semibold text-neutral-600 text-xs">${u.phone || '—'}</td>
                <td class="py-4 px-4">${roleBadge}</td>
                <td class="py-4 px-4 text-neutral-600 text-xs">${u.district || u.state || 'India'}</td>
                <td class="py-4 px-6 text-right">
                  ${isRoot ? '<span class="text-xs text-neutral-400 font-bold">Protected</span>' : `
                    <select onchange="changeRole('${u.id}', this.value)" class="text-xs font-bold px-3 py-1.5 bg-neutral-100 rounded-xl border border-neutral-200">
                      <option value="farmer" ${u.role === 'farmer' ? 'selected' : ''}>Farmer</option>
                      <option value="buyer" ${u.role === 'buyer' ? 'selected' : ''}>Buyer</option>
                      <option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Admin</option>
                    </select>
                  `}
                </td>
              </tr>
            `;
          }).join('');
        }

        async function changeRole(uid, newRole) {
          try {
            await window.FM.db.collection('users').doc(uid).update({ role: newRole });
            window.toast({ type: 'success', message: 'Role updated to ' + newRole });
            const u = allUsers.find(x => x.id === uid);
            if (u) u.role = newRole;
            renderUsers();
          } catch(e) {
            window.toast({ type: 'error', message: 'Failed to update role.' });
          }
        }
      </script>

    </div>
  </main>
</body>
</html>
