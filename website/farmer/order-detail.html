<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Details | KisanMitra</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              DEFAULT: '#2D5016',
              50:  '#F2F7EC',
              100: '#E0EDD0',
              200: '#BEDBA2',
              300: '#90C168',
              400: '#68A83B',
              500: '#4A7C23',
              600: '#2D5016',
              700: '#1A3009',
              800: '#0E1C05',
              900: '#060D02',
            },
            accent: {
              DEFAULT: '#C17F24',
              50:  '#FDF8EE',
              100: '#F9EDD1',
              200: '#F3D89E',
              300: '#EAC060',
              400: '#DEA737',
              500: '#C17F24',
              600: '#9A6119',
              700: '#744912',
              800: '#4E300B',
              900: '#281805',
            },
            neutral: {
              50:  '#F9F7F2',
              100: '#F0EDE6',
              200: '#E2DDD5',
              300: '#C8C2B8',
              400: '#A09890',
              500: '#7A7268',
              600: '#5A5450',
              700: '#403C38',
              800: '#2A2724',
              900: '#1A1A18',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/cloudinary.js"></script>
  <script src="../js/produce-images.js"></script>
  <script src="../js/panel.js"></script>
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased min-h-screen flex flex-col">
  <main id="main-content" class="flex-1 lg:ml-72 transition-all duration-300 min-h-screen flex flex-col">
    <div class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">

      <div class="max-w-4xl mx-auto space-y-8">
        <div>
          <a href="orders.html" class="text-neutral-500 text-xs font-bold hover:text-primary mb-2 inline-flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i> Back to Orders
          </a>
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h1 class="text-3xl font-extrabold text-neutral-900 tracking-tight" id="order-title">Order Details</h1>
              <p id="order-date-time" class="text-xs text-neutral-500 mt-1">Loading timestamp...</p>
            </div>
            <div id="order-status-badge-container"></div>
          </div>
        </div>

        <!-- Action Control Panel matching ORDER_TRANSITIONS -->
        <div class="bg-white rounded-3xl p-6 border border-neutral-100 shadow-sm space-y-4">
          <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-wider">Fulfillment Actions</h2>
          <div id="actions-bar" class="flex flex-wrap gap-3">
            <!-- Dynamically populated buttons -->
          </div>
        </div>

        <!-- Order Items Table -->
        <div class="bg-white rounded-3xl p-6 border border-neutral-100 shadow-sm space-y-4">
          <h2 class="text-lg font-bold text-neutral-900">Purchased Items</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
                <tr class="border-b border-neutral-100 text-xs font-semibold text-neutral-400 uppercase tracking-wider">
                  <th class="pb-3 px-4">Item</th>
                  <th class="pb-3 px-4">Qty</th>
                  <th class="pb-3 px-4">Unit Price</th>
                  <th class="pb-3 px-4 text-right">Subtotal</th>
                </tr>
              </thead>
              <tbody id="order-items-tbody" class="divide-y divide-neutral-50 text-sm">
                <tr><td colspan="4" class="py-6 text-center text-neutral-400">Loading order items...</td></tr>
              </tbody>
            </table>
          </div>
          <div class="pt-4 border-t border-neutral-100 flex flex-col items-end space-y-2 text-sm">
            <div class="flex justify-between w-64 text-neutral-600">
              <span>Subtotal:</span>
              <span id="order-subtotal" class="font-semibold">₹0</span>
            </div>
            <div class="flex justify-between w-64 text-neutral-600">
              <span>Delivery Fee:</span>
              <span id="order-fee" class="font-semibold">₹0</span>
            </div>
            <div class="flex justify-between w-64 text-lg font-black text-neutral-900 pt-2 border-t border-neutral-200">
              <span>Total:</span>
              <span id="order-total" class="text-primary">₹0</span>
            </div>
          </div>
        </div>

        <!-- Buyer & Delivery Details -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-white rounded-3xl p-6 border border-neutral-100 shadow-sm space-y-3">
            <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-wider">Buyer Information</h2>
            <p id="buyer-name" class="font-bold text-neutral-900 text-base">Loading...</p>
            <p id="buyer-phone" class="text-sm text-neutral-600 font-medium"></p>
            <p id="buyer-email" class="text-xs text-neutral-400"></p>
          </div>
          <div class="bg-white rounded-3xl p-6 border border-neutral-100 shadow-sm space-y-3">
            <h2 class="text-sm font-bold text-neutral-400 uppercase tracking-wider">Delivery Details</h2>
            <p id="delivery-type" class="font-bold text-neutral-900 text-base capitalize">Home Delivery</p>
            <p id="delivery-address" class="text-sm text-neutral-600 leading-relaxed"></p>
          </div>
        </div>
      </div>

      <script>
        let curOrder = null;

        document.addEventListener('DOMContentLoaded', () => {
          window.initPanel({ role: 'farmer', currentPage: 'orders', title: 'Order Details' });
          const orderId = new URLSearchParams(window.location.search).get('id');

          if (!orderId) {
            window.location.href = 'orders.html';
            return;
          }

          document.addEventListener('user-loaded', async () => {
            try {
              const doc = await window.FM.db.collection('orders').doc(orderId).get();
              if (!doc.exists) {
                alert('Order not found');
                window.location.href = 'orders.html';
                return;
              }
              curOrder = { id: doc.id, ...doc.data() };
              renderOrderDetail();
            } catch(err) {
              console.error(err);
            }
          });
        });

        function renderOrderDetail() {
          const o = curOrder;
          document.getElementById('order-title').textContent = 'Order #' + o.id.slice(0,8);
          const dt = o.createdAt?.toDate ? o.createdAt.toDate() : new Date(o.createdAt);
          document.getElementById('order-date-time').textContent = 'Placed on ' + dt.toLocaleString('en-IN');
          document.getElementById('order-status-badge-container').innerHTML = window.getOrderStatusBadge(o.status || 'pending');

          // Buyer & Address
          document.getElementById('buyer-name').textContent = o.buyerName || 'Buyer';
          document.getElementById('buyer-phone').textContent = o.deliveryAddress?.phone || o.buyerPhone || 'Phone not provided';
          document.getElementById('delivery-type').textContent = o.deliveryType === 'pickup' ? 'Self Pickup by Buyer' : 'Home Delivery';
          
          if (o.deliveryAddress) {
            const a = o.deliveryAddress;
            document.getElementById('delivery-address').textContent = `${a.name || ''}, ${a.line1 || ''}, ${a.city || ''}, ${a.state || ''} - ${a.pincode || ''}`;
          } else {
            document.getElementById('delivery-address').textContent = 'Pickup at farm';
          }

          // Items Table
          const tbody = document.getElementById('order-items-tbody');
          tbody.innerHTML = (o.items || []).map(i => `
            <tr class="hover:bg-neutral-50/50">
              <td class="py-3 px-4 font-bold text-neutral-800">${i.name}</td>
              <td class="py-3 px-4 font-semibold text-neutral-600">${i.quantity} ${i.unit || 'kg'}</td>
              <td class="py-3 px-4 text-neutral-600">${window.formatCurrency(i.unitPrice || i.price)}</td>
              <td class="py-3 px-4 text-right font-extrabold text-neutral-900">${window.formatCurrency((i.unitPrice || i.price) * i.quantity)}</td>
            </tr>
          `).join('');

          document.getElementById('order-subtotal').textContent = window.formatCurrency(o.subtotal || o.total);
          document.getElementById('order-fee').textContent = window.formatCurrency(o.deliveryFee || 0);
          document.getElementById('order-total').textContent = window.formatCurrency(o.total);

          renderActionButtons();
          if (window.lucide) lucide.createIcons();
        }

        function renderActionButtons() {
          const bar = document.getElementById('actions-bar');
          const s = curOrder.status || 'pending';
          let buttons = '';

          if (s === 'pending') {
            buttons = `
              <button onclick="updateStatus('accepted')" class="btn-primary rounded-full px-6 py-2.5 font-bold shadow-md">Accept Order</button>
              <button onclick="updateStatus('rejected')" class="btn-danger rounded-full px-6 py-2.5 font-bold">Reject Order</button>
            `;
          } else if (s === 'accepted') {
            buttons = `<button onclick="updateStatus('processing')" class="btn-primary rounded-full px-6 py-2.5 font-bold shadow-md">Mark Processing</button>`;
          } else if (s === 'processing') {
            buttons = `<button onclick="updateStatus('ready_for_dispatch')" class="btn-primary rounded-full px-6 py-2.5 font-bold shadow-md">Mark Ready for Dispatch</button>`;
          } else if (s === 'ready_for_dispatch') {
            buttons = `<button onclick="updateStatus('out_for_delivery')" class="btn-primary rounded-full px-6 py-2.5 font-bold shadow-md">Mark Out for Delivery</button>`;
          } else if (s === 'out_for_delivery') {
            buttons = `<button onclick="updateStatus('delivered')" class="btn-primary rounded-full px-6 py-2.5 font-bold shadow-md bg-emerald-700">Mark as Delivered</button>`;
          } else {
            buttons = '<p class="text-sm font-semibold text-neutral-400">No further actions required for this order.</p>';
          }

          bar.innerHTML = buttons;
        }

        async function updateStatus(newStatus) {
          try {
            await window.FM.db.collection('orders').doc(curOrder.id).update({
              status: newStatus,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            curOrder.status = newStatus;
            window.toast({ type: 'success', message: 'Order status updated to ' + newStatus.replace(/_/g, ' ') });
            renderOrderDetail();
          } catch(err) {
            window.toast({ type: 'error', message: 'Failed to update order status.' });
          }
        }
      </script>

    </div>
  </main>
</body>
</html>
