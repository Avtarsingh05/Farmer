<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management | KisanMitra</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: {
              DEFAULT: '#2D5016',
              50:  '#F2F7EC',
              100: '#E0EDD0',
              200: '#BEDBA2',
              300: '#90C168',
              400: '#68A83B',
              500: '#4A7C23',
              600: '#2D5016',
              700: '#1A3009',
              800: '#0E1C05',
              900: '#060D02',
            },
            accent: {
              DEFAULT: '#C17F24',
              50:  '#FDF8EE',
              100: '#F9EDD1',
              200: '#F3D89E',
              300: '#EAC060',
              400: '#DEA737',
              500: '#C17F24',
              600: '#9A6119',
              700: '#744912',
              800: '#4E300B',
              900: '#281805',
            },
            neutral: {
              50:  '#F9F7F2',
              100: '#F0EDE6',
              200: '#E2DDD5',
              300: '#C8C2B8',
              400: '#A09890',
              500: '#7A7268',
              600: '#5A5450',
              700: '#403C38',
              800: '#2A2724',
              900: '#1A1A18',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../styles/main.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/cloudinary.js"></script>
  <script src="../js/produce-images.js"></script>
  <script src="../js/panel.js"></script>
</head>
<body class="bg-neutral-50 text-neutral-900 font-sans antialiased min-h-screen flex flex-col">
  <main id="main-content" class="flex-1 lg:ml-72 transition-all duration-300 min-h-screen flex flex-col">
    <div class="flex-1 p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto">

      <div class="space-y-6">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h1 class="text-3xl font-extrabold text-neutral-900 tracking-tight">Inventory</h1>
            <p class="text-sm text-neutral-500 mt-1">Real-time produce warehouse tracking and stock replenishment.</p>
          </div>
          <button onclick="openAddStockModal()" class="btn-primary rounded-full px-6 py-2.5 font-bold shadow-md hover:-translate-y-0.5 transition-all inline-flex items-center gap-2">
            <i data-lucide="plus" class="w-5 h-5"></i> Add Stock
          </button>
        </div>

        <div id="low-stock-banner" class="hidden bg-amber-50 border border-amber-200/60 p-5 rounded-3xl flex items-center justify-between shadow-sm">
          <div class="flex items-center gap-3">
            <div class="p-2 bg-amber-100 rounded-xl text-amber-700">
              <i data-lucide="alert-triangle" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 class="font-bold text-amber-900 text-sm">Low Stock Alert</h3>
              <p id="low-stock-desc" class="text-amber-700 text-xs mt-0.5">Some items have fallen below their safety threshold.</p>
            </div>
          </div>
        </div>

        <!-- Inventory Table -->
        <div class="bg-white rounded-3xl border border-neutral-100 shadow-sm overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
                <tr class="border-b border-neutral-100 text-xs font-semibold text-neutral-400 uppercase tracking-wider bg-neutral-50/50">
                  <th class="py-4 px-6">Product</th>
                  <th class="py-4 px-4">Available Stock</th>
                  <th class="py-4 px-4">Reserved</th>
                  <th class="py-4 px-4">Threshold</th>
                  <th class="py-4 px-4">Status</th>
                  <th class="py-4 px-6 text-right">Action</th>
                </tr>
              </thead>
              <tbody id="inventory-tbody" class="divide-y divide-neutral-100 text-sm">
                <tr><td colspan="6" class="py-12 text-center text-neutral-400">Loading inventory items...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Add Stock Modal -->
      <div id="add-stock-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
        <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" onclick="closeAddStockModal()"></div>
        <div class="relative bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl space-y-6">
          <h2 class="text-xl font-bold text-neutral-900">Add Stock to Produce</h2>
          <div class="space-y-4">
            <div>
              <label class="block text-xs font-bold text-neutral-600 mb-1">Select Product</label>
              <select id="modal-product-select" class="w-full px-4 py-2.5 rounded-xl bg-neutral-50 border border-neutral-200 text-sm"></select>
            </div>
            <div>
              <label class="block text-xs font-bold text-neutral-600 mb-1">Quantity to Add</label>
              <input type="number" id="modal-add-qty" min="1" value="50" class="w-full px-4 py-2.5 rounded-xl bg-neutral-50 border border-neutral-200 text-sm">
            </div>
          </div>
          <div class="flex justify-end gap-3">
            <button onclick="closeAddStockModal()" class="px-5 py-2.5 rounded-full font-bold text-neutral-600 hover:bg-neutral-100 text-sm">Cancel</button>
            <button onclick="submitAddStock()" class="btn-primary rounded-full px-6 py-2.5 font-bold text-sm shadow-md">Add to Inventory</button>
          </div>
        </div>
      </div>

      <script>
        let inventoryProducts = [];

        document.addEventListener('DOMContentLoaded', () => {
          window.initPanel({ role: 'farmer', currentPage: 'inventory', title: 'Inventory Control' });

          document.addEventListener('user-loaded', async (e) => {
            const user = e.detail;
            try {
              const snap = await window.FM.db.collection('products').where('farmerId', '==', user.uid).get();
              inventoryProducts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
              renderInventory();
            } catch(err) {
              console.error(err);
            }
          });
        });

        function renderInventory() {
          const tbody = document.getElementById('inventory-tbody');
          const lowStock = inventoryProducts.filter(p => (p.stock || 0) <= (p.lowStockThreshold || 10));

          if (lowStock.length > 0) {
            document.getElementById('low-stock-banner').classList.remove('hidden');
            document.getElementById('low-stock-desc').textContent = `${lowStock.length} product(s) are at or below minimum threshold. Please replenish.`;
          }

          if (inventoryProducts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="py-12 text-center text-neutral-400">No products found. Add products to manage inventory.</td></tr>';
            return;
          }

          tbody.innerHTML = inventoryProducts.map(p => {
            const isLow = (p.stock || 0) <= (p.lowStockThreshold || 10);
            return `
              <tr class="hover:bg-neutral-50/50">
                <td class="py-4 px-6 font-bold text-neutral-900">${p.name}</td>
                <td class="py-4 px-4">
                  <div class="flex items-center gap-2">
                    <span class="font-extrabold text-base ${isLow ? 'text-red-600' : 'text-neutral-900'}">${p.stock || 0}</span>
                    <span class="text-xs text-neutral-400">${p.unit || 'kg'}</span>
                  </div>
                </td>
                <td class="py-4 px-4 font-semibold text-neutral-500">0 ${p.unit || 'kg'}</td>
                <td class="py-4 px-4 text-neutral-600">${p.lowStockThreshold || 10} ${p.unit || 'kg'}</td>
                <td class="py-4 px-4">
                  ${isLow 
                    ? '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-red-100 text-red-700">Low Stock</span>' 
                    : '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-700">In Stock</span>'}
                </td>
                <td class="py-4 px-6 text-right">
                  <button onclick="promptEditStock('${p.id}', ${p.stock || 0})" class="px-3 py-1.5 rounded-xl text-xs font-bold bg-neutral-100 hover:bg-primary hover:text-white transition-colors">
                    Edit Qty
                  </button>
                </td>
              </tr>
            `;
          }).join('');
          if (window.lucide) lucide.createIcons();
        }

        async function promptEditStock(id, currentStock) {
          const val = prompt('Enter new stock quantity:', currentStock);
          if (val === null) return;
          const num = parseInt(val);
          if (isNaN(num) || num < 0) {
            alert('Invalid quantity');
            return;
          }

          try {
            await window.FM.db.collection('products').doc(id).update({
              stock: num,
              availableQty: num
            });
            const p = inventoryProducts.find(x => x.id === id);
            if (p) p.stock = num;
            renderInventory();
            window.toast({ type: 'success', message: 'Stock updated to ' + num });
          } catch(err) {
            window.toast({ type: 'error', message: 'Failed to update stock.' });
          }
        }

        function openAddStockModal() {
          const sel = document.getElementById('modal-product-select');
          sel.innerHTML = inventoryProducts.map(p => `<option value="${p.id}">${p.name} (Current: ${p.stock||0} ${p.unit||'kg'})</option>`).join('');
          document.getElementById('add-stock-modal').classList.remove('hidden');
        }

        function closeAddStockModal() {
          document.getElementById('add-stock-modal').classList.add('hidden');
        }

        async function submitAddStock() {
          const id = document.getElementById('modal-product-select').value;
          const addQty = parseInt(document.getElementById('modal-add-qty').value) || 0;
          if (!id || addQty <= 0) return;

          const p = inventoryProducts.find(x => x.id === id);
          if (!p) return;
          const newQty = (p.stock || 0) + addQty;

          try {
            await window.FM.db.collection('products').doc(id).update({
              stock: newQty,
              availableQty: newQty
            });
            p.stock = newQty;
            renderInventory();
            closeAddStockModal();
            window.toast({ type: 'success', message: `Added ${addQty} ${p.unit||'kg'} to ${p.name}` });
          } catch(err) {
            window.toast({ type: 'error', message: 'Error updating inventory.' });
          }
        }
      </script>

    </div>
  </main>
</body>
</html>
